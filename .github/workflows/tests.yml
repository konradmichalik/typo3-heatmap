name: Tests
on:
  push:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        typo3-version: ['^12.4', '^13.4']
        dependencies: ['highest', 'lowest']
    name: PHP ${{ matrix.php-version }} / TYPO3 ${{ matrix.typo3-version }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # Pin Composer 2.8: newer Composer blocks packages affected by
          # security advisories during resolution, which currently makes every
          # released TYPO3 12.4.x unresolvable. 2.8 warns instead.
          tools: composer:2.8
          coverage: none
      - name: Require TYPO3 ${{ matrix.typo3-version }}
        run: |
          composer require --no-update \
            typo3/cms-backend:"${{ matrix.typo3-version }}" \
            typo3/cms-core:"${{ matrix.typo3-version }}" \
            typo3/cms-dashboard:"${{ matrix.typo3-version }}" \
            typo3/cms-fluid:"${{ matrix.typo3-version }}"
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - name: Run tests
        run: composer test
